<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электронный журнал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <h1 class="app-title">Электронный журнал</h1>
      <div class="header-right">
        <span id="userInfo" class="user-info"></span>
        <button id="logoutBtn" class="btn btn-outline">Выйти</button>
      </div>
    </header>
    <div class="app-body">
      <nav id="sidebar" class="sidebar">
        <!-- динамическое меню -->
      </nav>
      <main id="mainContent" class="main-content">
        <div style="text-align:center;padding:80px 20px">
          <div style="font-size:64px;margin-bottom:20px">🎓</div>
          <h2 style="color:#fff;font-weight:700;font-size:1.75rem">Электронный журнал колледжа</h2>
          <p style="color:rgba(255,255,255,0.4);font-size:1rem;margin-top:8px">Выберите раздел из меню слева для начала работы</p>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="pages/colleges.js"></script>
  <script src="pages/subjects.js"></script>
  <script src="pages/topics.js"></script>
  <script src="pages/groups.js"></script>
  <script src="pages/students.js"></script>
  <script src="pages/lessons.js"></script>
  <script src="pages/grades.js"></script>
  <script src="pages/reports.js"></script>
  <script src="pages/users.js"></script>
</body>
</html>
